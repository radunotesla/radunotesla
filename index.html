<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrazione Raduno Tesla 2026</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f7; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 600px; background: #fff; margin: 0 auto; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .header { text-align: center; border-bottom: 2px solid #cc0000; padding-bottom: 20px; margin-bottom: 25px; }
        .header h1 { color: #cc0000; margin: 0 0 5px 0; font-size: 26px; text-transform: uppercase; letter-spacing: 1px; }
        .header p { margin: 5px 0; color: #666; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
        input[type="text"], input[type="email"], input[type="number"], select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 15px; }
        .row { display: flex; gap: 15px; }
        .row .form-group { flex: 1; }
        .calc-container { display: flex; gap: 10px; align-items: flex-end; }
        .btn-calc { background-color: #555; color: white; border: none; padding: 12px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; white-space: nowrap; }
        .btn-calc:hover { background-color: #333; }
        .btn-submit { width: 100%; background-color: #cc0000; color: white; border: none; padding: 15px; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 20px; }
        .btn-submit:hover { background-color: #990000; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Raduno Tesla</h1>
        <p><strong>SABATO 24 OTTOBRE 2026</strong></p>
        <p>Dalle 15:00 Fino Al Tramonto</p>
        <p>Campo Volo Leonardo da Vinci - Strada Scoglio 27029 Vigevano (PV)</p>
    </div>

    <form id="registrationForm">
        <div class="row">
            <div class="form-group">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" required>
            </div>
            <div class="form-group">
                <label for="cognome">Cognome</label>
                <input type="text" id="cognome" name="cognome" required>
            </div>
        </div>

        <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="row">
            <div class="form-group">
                <label for="targa">Targa (Solo i 3 numeri centrali)</label>
                <input type="text" id="targa" name="targa" pattern="\d{3}" maxlength="3" placeholder="Es. 123" required>
            </div>
            <div class="form-group">
                <label for="nascita">Data di Nascita</label>
                <input type="date" id="nascita" name="nascita" required>
            </div>
        </div>

        <div class="form-group">
            <label for="km_tesla">Quanti KM ha la tua Tesla?</label>
            <input type="number" id="km_tesla" name="km_tesla" required>
        </div>

        <div class="form-group">
            <label for="citta">Città di provenienza</label>
            <select id="citta" name="citta" required>
                <option value="">Seleziona la tua città...</option>
                <option value="Milano" data-dist="40">Milano</option>
                <option value="Torino" data-dist="110">Torino</option>
                <option value="Pavia" data-dist="45">Pavia</option>
                <option value="Novara" data-dist="30">Novara</option>
                <option value="Genova" data-dist="140">Genova</option>
            </select>
        </div>

        <div class="form-group">
            <label>Km percorsi stimati per raggiungere Vigevano</label>
            <div class="calc-container">
                <input type="text" id="km_viaggio" name="km_viaggio" readonly placeholder="Clicca su Calcola...">
                <button type="button" class="btn-calc" onclick="calcolaKm()">CALCOLA km percorsi</button>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label for="modello">Modello della tua Tesla</label>
                <select id="modello" name="modello" required>
                    <option value="">Scegli modello...</option>
                    <option value="Model S">Model S</option>
                    <option value="Model 3">Model 3</option>
                    <option value="Model X">Model X</option>
                    <option value="Model Y">Model Y</option>
                    <option value="Altro">Cybertruck / Altro</option>
                </select>
            </div>
            <div class="form-group">
                <label for="immatricolazione">Mese/Anno Immatricolazione</label>
                <input type="month" id="immatricolazione" name="immatricolazione" required>
            </div>
        </div>

        <button type="submit" class="btn-submit">Conferma e Invia</button>
    </form>
</div>

<script>
    function calcolaKm() {
        const cittaSelect = document.getElementById('citta');
        const selectedOption = cittaSelect.options[cittaSelect.selectedIndex];
        const dist = selectedOption.getAttribute('data-dist');
        
        if (dist) {
            document.getElementById('km_viaggio').value = dist + " KM";
        } else {
            alert("Seleziona prima una città di provenienza.");
        }
    }

    document.getElementById('registrationForm').submit(function(e) {
        e.preventDefault();
        // Qui si collegherà lo script di invio automatico ed elaborazione PDF
        alert("Modulo pronto per l'invio!");
    });
</script>

</body>
</html>
