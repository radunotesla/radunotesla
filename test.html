<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mappa e Percorso Raduno Tesla</title>
    
    <!-- 1. CARICAMENTO DELLE LIBRERIE MAPPA (CORRETTE E COMPLETE) -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>

    <!-- 2. CARICAMENTO DEL MOTORE DI PERCORSI STRADALI -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f9f9f9;
            max-width: 600px;
            margin: 20px auto;
            padding: 15px;
        }
        h1 { color: #cc0000; }
        .form-group { position: relative; margin-bottom: 15px; text-align: left; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 10px; box-sizing: border-box; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        
        /* Pannello dei suggerimenti delle città */
        #suggerimenti-citta {
            position: absolute;
            border: 1px solid #ccc;
            background-color: #ffffff;
            z-index: 9999;
            top: 100%;
            left: 0;
            right: 0;
            max-height: 200px;
            overflow-y: auto;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
            display: none;
        }
        
        button { background-color: #cc0000; color: white; border: none; padding: 12px; width: 100%; cursor: pointer; font-weight: bold; border-radius: 4px; font-size: 16px; margin-top: 10px; }
        button:hover { background-color: #990000; }

        /* Riquadro della mappa */
        #map-container {
            width: 100%;
            height: 400px;
            margin-top: 20px;
            border-radius: 8px;
            border: 2px solid #cc0000;
            background-color: #eee;
        }
    </style>
</head>
<body>

    <h1>🚗 Calcolo Itinerario Tesla</h1>
    <p>Scegli la città per vedere il percorso stradale reale fino al raduno.</p>

    <div class="form-group">
        <label>CITTÀ DI PROVENIENZA:</label>
        <input type="text" id="citta" placeholder="Inizia a scrivere (es. Monguzzo, Milano...)" autocomplete="off">
        <div id="suggerimenti-citta"></div>
    </div>

    <button type="button" id="btn-calcola">CALCOLA PERCORSO E KM</button>

    <div class="form-group" style="margin-top: 15px;">
        <label>KM REALI SU STRADA:</label>
        <input type="text" id="km_fatti" readonly placeholder="I chilometri stradali appariranno qui...">
    </div>

    <!-- Campi nascosti per memorizzare le coordinate di partenza -->
    <input type="hidden" id="cittaLat">
    <input type="hidden" id="cittaLon">

    <!-- La Mappa -->
    <div id="map-container"></div>

    <script>
        // Coordinate fisse del Raduno (Campo Volo, Vigevano)
        const latVigevano = 45.2974;
        const lonVigevano = 8.8952;

        // 3. INIZIALIZZA LA MAPPA CENTRATA SU VIGEVANO
        const map = L.map('map-container').setView([latVigevano, lonVigevano], 10);

        // 4. AGGIUNGI LA GRAFICA STRADALE DI OPENSTREETMAP
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Aggiunge un marker sul punto di arrivo fisso
        const markerArrivo = L.marker([latVigevano, lonVigevano]).addTo(map)
            .bindPopup("<b>Traguardo Raduno Tesla</b><br>Vigevano")
            .openPopup();

        // 5. CONFIGURA IL MOTORE DI RICERCA PERCORSI (Inizialmente vuoto)
        const routingControl = L.Routing.control({
            waypoints: [],
            language: 'it',
            createMarker: function() { return null; }, // Evita marker doppi brutti sulla mappa
            lineOptions: {
                styles: [{ color: '#cc0000', weight: 5 }] // Disegna la linea stradale in rosso Tesla
            },
            show: false // Nasconde il pannello di testo con le svolte a destra/sinistra per pulizia
        }).addTo(map);

        // Quando il motore trova la strada, legge i KM e li mette nella casella di testo
        routingControl.on('routesfound', function(e) {
            const routes = e.routes;
            const summary = routes[0].summary;
            const kmStradali = Math.round(summary.totalDistance / 1000);
            document.getElementById('km_fatti').value = kmStradali;
        });


        // ========================================================
        // 6. LOGICA AUTOCOMPLETE (IL TUO CODICE DEL COMUNE)
        // ========================================================
        let debounce;
        const inputCitta = document.getElementById('citta');
        const suggBox = document.getElementById('suggerimenti-citta');

        inputCitta.addEventListener('input', () => {
            clearTimeout(debounce);
            const q = inputCitta.value.trim();
            if (q.length < 2) {
                suggBox.innerHTML = '';
                suggBox.style.display = 'none';
                return;
            }
            debounce = setTimeout(() => cercaCitta(q), 350);
        });

        async function cercaCitta(q) {
            try {
                const res = await fetch(`https://openstreetmap.org{encodeURIComponent(q)}&countrycodes=it&addressdetails=1`);
                const data = await res.json();
                suggBox.innerHTML = '';

                if (data && data.length > 0) {
                    suggBox.style.display = 'block';
                    data.forEach(p => {
                        const divCitta = document.createElement('div');
                        
                        divCitta.style.padding = '12px';
                        divCitta.style.cursor = 'pointer';
                        divCitta.style.color = '#333333';
                        divCitta.style.borderBottom = '1px solid #f0f0f0';
                        divCitta.style.backgroundColor = '#ffffff';

                        const nomePulito = p.display_name.split(',').slice(0,3).join(',').trim();
                        divCitta.textContent = nomePulito;

                        divCitta.onclick = () => {
                            inputCitta.value = nomePulito;
                            document.getElementById('cittaLat').value = p.lat;
                            document.getElementById('cittaLon').value = p.lon;
                            suggBox.innerHTML = '';
                            suggBox.style.display = 'none';
                        };
                        
                        suggBox.appendChild(divCitta);
                    });
                } else {
                    suggBox.style.display = 'none';
                }
            } catch (err) {
                console.error(err);
            }
        }

        // Chiude la tendina se si clicca altrove nella pagina
        document.addEventListener('click', function(e) {
            if (e.target !== inputCitta) {
                suggBox.style.display = 'none';
            }
        });


        // ========================================================
        // 7. ATTIVAZIONE DEL PERCORSO AL CLICK SUL BOTTONE
        // ========================================================
        document.getElementById('btn-calcola').addEventListener('click', function() {
            const latP = document.getElementById('cittaLat').value;
            const lonP = document.getElementById('cittaLon').value;

            if (!latP || !lonP) {
                alert("Per favore, digita la città e selezionala dal menu a tendina!");
                return;
            }

            // Calcola e disegna la linea del percorso stradale reale sulla mappa
            routingControl.setWaypoints([
                L.latLng(parseFloat(latP), parseFloat(lonP)), // Partenza scelta dall'utente
                L.latLng(latVigevano, lonVigevano)            // Arrivo fisso a Vigevano
            ]);
        });
    </script>
</body>
</html>
