<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integrazione Mappa e Comuni Tesla</title>
    
    <!-- Link reali e completi alle librerie della mappa e del calcolo stradale -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>

    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 20px auto; padding: 15px; text-align: center; }
        h2 { color: #cc0000; }
        .form-group { position: relative; margin-bottom: 15px; text-align: left; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 10px; box-sizing: border-box; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        
        /* Struttura della lista dei suggerimenti del tuo codice giallo */
        #suggerimenti-citta {
            position: absolute;
            border: 1px solid #ccc;
            background-color: #ffffff;
            z-index: 9999;
            top: 100%;
            left: 0;
            right: 0;
            max-height: 200px;
            overflow-y: auto;
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        button { background-color: #cc0000; color: white; border: none; padding: 12px; width: 100%; cursor: pointer; font-weight: bold; border-radius: 4px; font-size: 16px; margin-top: 10px; }
        button:hover { background-color: #990000; }

        /* Fissiamo l'altezza qui nel CSS: impedisce a Leaflet di mandare in crash la pagina */
        #contenitore-mappa {
            width: 100%;
            height: 350px !important;
            margin-top: 20px;
            border: 2px solid #cc0000;
            border-radius: 6px;
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>

    <h2>🚗 Test Modulo Stradale Tesla</h2>

    <div class="form-group">
        <label>CITTÀ DI PROVENIENZA:</label>
        <input type="text" id="citta" placeholder="Inizia a scrivere (es. Monguzzo...)" autocomplete="off">
        <!-- Contenitore della lista (ID usato nel tuo script giallo) -->
        <ul id="suggerimenti-citta"></ul>
    </div>

    <button type="button" id="btn-calcola">CALCOLA KM PERCORSI</button>

    <div class="form-group" style="margin-top: 15px;">
        <label>KM REALI SU STRADA:</label>
        <input type="text" id="km_fatti" readonly placeholder="I KM appariranno qui...">
    </div>

    <!-- Campi nascosti per memorizzare le coordinate recuperate dall'autocomplete -->
    <input type="hidden" id="cittaLat">
    <input type="hidden" id="cittaLon">

    <!-- Il riquadro in cui si genera la mappa stradale -->
    <div id="contenitore-mappa"></div>

    <script>
        // Coordinate fisse del Raduno (Campo Volo, Vigevano)
        const latVigevano = 45.2974;
        const lonVigevano = 8.8952;

        // 1. INIZIALIZZAZIONE SICURA DELLA MAPPA
        const map = L.map('contenitore-mappa').setView([latVigevano, lonVigevano], 11);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Segnaposto di arrivo su Vigevano
        L.marker([latVigevano, lonVigevano]).addTo(map).bindPopup('<b>Raduno Tesla</b><br>Arrivo').openPopup();

        // 2. CONFIGURAZIONE MOTORE DI ITINERARI (Risolve il problema del calcolo stradale)
        const routingControl = L.Routing.control({
            waypoints: [],
            language: 'it',
            createMarker: function() { return null; }, // Nasconde i marker doppi generati dal motore
            lineOptions: {
                styles: [{ color: '#cc0000', weight: 5 }] // Linea rossa del percorso
            },
            show: false // Nasconde i testi con l'elenco delle curve
        }).addTo(map);

        // Quando il motore calcola la strada, estrae la distanza e la scrive nell'input dei KM
        routingControl.on('routesfound', function(e) {
            const percorso = e.routes[0];
            const kmArrotondati = Math.round(percorso.summary.totalDistance / 1000);
            document.getElementById('km_fatti').value = kmArrotondati;
        });


        // ========================================================
        // 3. LOGICA REALE DEL TUO CODICE GIALLO (AUTOCAMPLETAMENTO)
        // ========================================================
        let debounce;
        const inputCitta = document.getElementById('citta');
        const suggBox = document.getElementById('suggerimenti-citta');

        if (inputCitta && suggBox) {
            inputCitta.addEventListener('input', () => {
                clearTimeout(debounce);
                const q = inputCitta.value.trim();
                if (q.length < 2) {
                    suggBox.innerHTML = '';
                    suggBox.style.display = 'none';
                    return;
                }
                debounce = setTimeout(() => cercaCitta(q), 350);
            });
        }

        async function cercaCitta(q) {
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=5&q=${encodeURIComponent(q)}&countrycodes=it&addressdetails=1`);
                const data = await res.json();
                suggBox.innerHTML = '';

                if (data && data.length > 0) {
                    suggBox.style.display = 'block';
                    data.forEach(p => {
                        const li = document.createElement('li');
                        
                        // Stili per rendere i suggerimenti chiaramente leggibili e cliccabili
                        li.style.padding = '12px';
                        li.style.cursor = 'pointer';
                        li.style.color = '#333333';
                        li.style.backgroundColor = '#ffffff';
                        li.style.borderBottom = '1px solid #f0f0f0';

                        const nomePulito = p.display_name.split(',').slice(0,3).join(',').trim();
                        li.textContent = nomePulito;

                        li.onclick = () => {
                            inputCitta.value = nomePulito;

                            // Salva i dati geografici per il calcolo stradale
                            document.getElementById('cittaLat').value = p.lat;
                            document.getElementById('cittaLon').value = p.lon;

                            suggBox.innerHTML = '';
                            suggBox.style.display = 'none';
                        };
                        
                        suggBox.appendChild(li);
                    });
                } else {
                    suggBox.style.display = 'none';
                }
            } catch (err) {
                console.error("Errore autocomplete:", err);
            }
        }

        // Chiude i suggerimenti se l'utente clicca fuori dalla casella
        document.addEventListener('click', function(e) {
            if (e.target !== inputCitta) {
                suggBox.style.display = 'none';
            }
        });


        // ========================================================
        // 4. ATTIVAZIONE TRAGITTO AL CLICK SUL BOTTONE
        // ========================================================
        document.getElementById('btn-calcola').addEventListener('click', function() {
            const latP = document.getElementById('cittaLat').value;
            const lonP = document.getElementById('cittaLon').value;

            if (!latP || !lonP) {
                alert("Per favore, digita la tua città e selezionala dal menu che appare!");
                return;
            }

            // Invia le coordinate al motore stradale che disegna il tragitto e aggiorna la casella dei KM
            routingControl.setWaypoints([
                L.latLng(parseFloat(latP), parseFloat(lonP)), // Partenza (es. Monguzzo)
                L.latLng(latVigevano, lonVigevano)            // Arrivo (Vigevano)
            ]);
        });
    </script>
</body>
</html>
